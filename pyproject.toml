[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgeradar"
version = "0.5.0"
description = "Alpaca diagnostics, surge detector and entitlement-gated universe selection"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<18", "psutil>=5.9,<8"]

[project.scripts]
surgeradar = "surgeradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
